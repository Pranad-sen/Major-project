const PIXELS_PER_FOOT = 50;

function ftToPx(ft) {

function getGraphNodes(){

  const nodes = [];

  function addNode(x, y){

    const existing =
      nodes.find(n =>
        Math.hypot(
          n.x - x,
          n.y - y
        ) < 5
      );

    if(existing)
      return;

    nodes.push({
      x,
      y
    });
  }

  vertices.forEach(v => {

    addNode(
      v.x,
      v.y
    );

  });

  interiorWalls.forEach(w => {

    addNode(
      w.x1,
      w.y1
    );

    addNode(
      w.x2,
      w.y2
    );
  });

  return nodes;
}

function getGraphEdges(){

  const edges = [];

  /* ROOM OUTER WALLS */

  for(let i = 0; i < vertices.length; i++){

    const a = vertices[i];
    const b =
      vertices[
        (i + 1) % vertices.length
      ];

    edges.push({

      x1: a.x,
      y1: a.y,

      x2: b.x,
      y2: b.y
    });
  }

  /* INTERIOR WALLS */

  interiorWalls.forEach(w => {

    edges.push({

      x1: w.x1,
      y1: w.y1,

      x2: w.x2,
      y2: w.y2
    });
  });

  return edges;
}

function getGraphAdjacency(){

  const nodes =
    getGraphNodes();

  const adjacency =
    new Map();

  nodes.forEach((node,index)=>{

    adjacency.set(
      index,
      []
    );
  });

  function findNodeIndex(x,y){

    return nodes.findIndex(n =>

      Math.hypot(
        n.x - x,
        n.y - y
      ) < 5
    );
  }

  const edges =
    getGraphEdges();

  edges.forEach(edge => {

    const a =
      findNodeIndex(
        edge.x1,
        edge.y1
      );

    const b =
      findNodeIndex(
        edge.x2,
        edge.y2
      );

    if(
      a === -1 ||
      b === -1
    ){
      return;
    }

    adjacency
      .get(a)
      .push(b);

    adjacency
      .get(b)
      .push(a);
  });

  return {
    nodes,
    adjacency
  };
}

  });
}

function getClosestSegment(x, y) {

  let minDist = Infinity;

  let insertIndex = -1;

  for (let i = 0; i < vertices.length; i++) {

    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const lenSq = dx * dx + dy * dy;

    if (lenSq === 0) continue;

    /* PROJECTION */
    let t =
      ((x - a.x) * dx + (y - a.y) * dy)
      / lenSq;

    /* STRICT SEGMENT RANGE */
    if (t < 0.05 || t > 0.95) continue;

    const px = a.x + t * dx;
    const py = a.y + t * dy;

    const dist = Math.hypot(x - px, y - py);

    if (dist < minDist) {

      minDist = dist;

      insertIndex = i + 1;
    }
  }

  return {
    index: insertIndex,
    distance: minDist
  };
}

function screenToWorld(clientX, clientY) {

  const viewportRect =
    viewport.getBoundingClientRect();

  /* WORKSPACE POSITION */
  const wx =
    (clientX - viewportRect.left - panX) / scale;

  const wy =
    (clientY - viewportRect.top - panY) / scale;

  /* CANVAS POSITION INSIDE WORKSPACE */
  const canvasX = parseFloat(
    getComputedStyle(canvas).left
  );

  const canvasY = parseFloat(
    getComputedStyle(canvas).top
  );

  return {

    x: wx - canvasX,

    y: wy - canvasY
  };
}

function getNearestSnapPoint(x, y){

  const SNAP_DIST = 25;

  let best = null;
  let bestDist = Infinity;

  const points = [];

  vertices.forEach(v => {
    points.push({
      x:v.x,
      y:v.y
    });
  });

  interiorWalls.forEach(w => {

    points.push({
      x:w.x1,
      y:w.y1
    });

    points.push({
      x:w.x2,
      y:w.y2
    });
  });

  for(const p of points){

    const dist =
      Math.hypot(
        x - p.x,
        y - p.y
      );

    if(
      dist < SNAP_DIST &&
      dist < bestDist
    ){

      bestDist = dist;
      best = p;
    }
  }

  return best;
}

function getNearestWallPoint(x, y) {

  let best = null;
  let bestDist = Infinity;

  /* ROOM WALLS */

  for (let i = 0; i < vertices.length; i++) {

    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const lenSq = dx * dx + dy * dy;

    if (lenSq === 0) continue;

    let t =
      ((x - a.x) * dx +
       (y - a.y) * dy) / lenSq;

    t = Math.max(0, Math.min(1, t));

    const px = a.x + t * dx;
    const py = a.y + t * dy;

    const dist =
      Math.hypot(
        x - px,
        y - py
      );

    if (dist < bestDist) {

      bestDist = dist;

      best = {
        x: px,
        y: py
      };
    }
  }

  /* INTERIOR WALLS */

  interiorWalls.forEach(w => {

    const dx = w.x2 - w.x1;
    const dy = w.y2 - w.y1;

    const lenSq =
      dx * dx + dy * dy;

    if (lenSq === 0) return;

    let t =
      ((x - w.x1) * dx +
       (y - w.y1) * dy) / lenSq;

    t = Math.max(0, Math.min(1, t));

    const px =
      w.x1 + t * dx;

    const py =
      w.y1 + t * dy;

    const dist =
      Math.hypot(
        x - px,
        y - py
      );

    if (dist < bestDist) {

      bestDist = dist;

      best = {
        x: px,
        y: py
      };
    }

  });

  if(bestDist > 40){
    return null;
  }

  return best;
}

function initRoom() {

  const r = canvas.getBoundingClientRect();

  if (r.width === 0 || r.height === 0) return;

  const w = Math.min(400, r.width * 0.6);
  const h = Math.min(300, r.height * 0.6);
  const cx = r.width / 2;
  const cy = r.height / 2;

  vertices = [
    {x: cx-w/2, y: cy-h/2},
    {x: cx+w/2, y: cy-h/2},
    {x: cx+w/2, y: cy+h/2},
    {x: cx-w/2, y: cy+h/2}
  ];
  drawRoom();
}

viewport.addEventListener("wheel", e => {

  e.preventDefault();

  const rect =
    viewport.getBoundingClientRect();

  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const wx = (mx - panX) / scale;
  const wy = (my - panY) / scale;

  /* SYMMETRIC ZOOM */
  const zoomIntensity = 0.0045;

  const zoom =
    Math.exp(-e.deltaY * zoomIntensity);

  scale *= zoom;

  scale = Math.max(0.2, Math.min(4, scale));

  panX = mx - wx * scale;
  panY = my - wy * scale;

  updateWorkspaceTransform();

}, { passive:false });

const rh = document.getElementById("rh");

let furniture = {};
let nextId = 1;

function pointInPolygon(p, poly) {

  let inside = false;

  for (let i=0,j=poly.length-1;i<poly.length;j=i++) {

    const xi=poly[i].x, yi=poly[i].y;
    const xj=poly[j].x, yj=poly[j].y;

    const intersect =
      ((yi>p.y)!=(yj>p.y)) &&
      (p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

function rectInsidePolygon(x, y, w, h, poly) {

  const corners = [
    { x:x, y:y },
    { x:x+w, y:y },
    { x:x+w, y:y+h },
    { x:x, y:y+h }
  ];

  return corners.every(pt => pointInPolygon(pt, poly));
}

function overlap(id,x,y,w,h){

  for(const k in furniture){

    if(k===id) continue;

    const o=furniture[k];

    const ox=parseFloat(o.el.style.left);
    const oy=parseFloat(o.el.style.top);

    const ow = ftToPx(o.wFt);
    const oh = ftToPx(o.hFt);

    if (
      x < ox + ow &&
      x + w > ox &&
      y < oy + oh &&
      y + h > oy
    ) {
      return true;
    }
  }

  return false;
}

function lineSegmentsIntersect(
  x1,y1,x2,y2,
  x3,y3,x4,y4
){

  const den =
    (x1-x2)*(y3-y4) -
    (y1-y2)*(x3-x4);

  if(Math.abs(den) < 0.0001)
    return false;

  const t =
    (
      (x1-x3)*(y3-y4) -
      (y1-y3)*(x3-x4)
    ) / den;

  const u =
    -(
      (x1-x2)*(y1-y3) -
      (y1-y2)*(x1-x3)
    ) / den;

  return (
    t >= 0 &&
    t <= 1 &&
    u >= 0 &&
    u <= 1
  );
}

function pointOnSegment(
  px, py,
  x1, y1,
  x2, y2
){

  const tolerance = 5;

  const d1 =
    Math.hypot(
      px - x1,
      py - y1
    );

  const d2 =
    Math.hypot(
      px - x2,
      py - y2
    );

  const lineLen =
    Math.hypot(
      x2 - x1,
      y2 - y1
    );

  return Math.abs(
    d1 + d2 - lineLen
  ) < tolerance;
}

function splitWallAtPoint(px, py){

  for(let i = 0; i < interiorWalls.length; i++){

    const w = interiorWalls[i];

    if(
      pointOnSegment(
        px, py,
        w.x1, w.y1,
        w.x2, w.y2
      )
    ){

      const isEndpoint =
        (
          Math.hypot(
            px - w.x1,
            py - w.y1
          ) < 5
        ) ||
        (
          Math.hypot(
            px - w.x2,
            py - w.y2
          ) < 5
        );

      if(isEndpoint)
        return;

      interiorWalls.splice(i,1);

      interiorWalls.push({
        x1: w.x1,
        y1: w.y1,
        x2: px,
        y2: py
      });

      interiorWalls.push({
        x1: px,
        y1: py,
        x2: w.x2,
        y2: w.y2
      });

      return;
    }
  }
}

function collidesWithWall(
  x,
  y,
  w,
  h
){

  const inset =
    Math.min(w,h) * 0.20;

  const left =
    x + inset;

  const right =
    x + w - inset;

  const top =
    y + inset;

  const bottom =
    y + h - inset;

  const edges = [

    [left,top,right,top],

    [right,top,right,bottom],

    [right,bottom,left,bottom],

    [left,bottom,left,top]
  ];

  for(const wall of interiorWalls){

    for(const edge of edges){

      if(
        lineSegmentsIntersect(

          edge[0],
          edge[1],
          edge[2],
          edge[3],

          wall.x1,
          wall.y1,
          wall.x2,
          wall.y2
        )
      ){
        return true;
      }
    }
  }

  return false;
}

function createFurnitureElement(name,img,wFt,hFt,x,y){

  const id = "f" + nextId++;

  const el = document.createElement("div");

  el.className = "furniture";

  const wPx = ftToPx(wFt);
  const hPx = ftToPx(hFt);

  el.style.width = wPx + "px";
  el.style.height = hPx + "px";

  el.style.left = x - wPx/2 + "px";
  el.style.top = y - hPx/2 + "px";

  furniture[id] = { el, wFt, hFt, rotation: 0 };

  el.innerHTML = `
    <img src="${img}">
  `;

  const ctr = document.createElement("div");
  ctr.className = "f-controls";

  const del = document.createElement("button");
  del.textContent = "✕";

  ctr.appendChild(del);

  el.appendChild(ctr);

  del.onclick = e => {

    e.stopPropagation();

    el.remove();

    delete furniture[id];

    resizePanel.style.display = "none";

    saveState();
  };

  el.onmousedown = e => {

    if(!moveMode) return;

    e.stopPropagation();

    draggingFurniture = id;
    selected = id;
    document.querySelectorAll(".furniture")
      .forEach(f => f.classList.remove("selected"));

    el.classList.add("selected");

    rw.value = furniture[id].wFt;
    rh.value = furniture[id].hFt;

    console.log("Furniture selected");
    console.log(resizePanel);

    resizePanel.style.display = "block";

    const world =
        screenToWorld(e.clientX, e.clientY);

    const left =
        parseFloat(el.style.left);

    const top =
        parseFloat(el.style.top);

    offset.x = world.x - left;
    offset.y = world.y - top;
  };

  furnitureLayer.appendChild(el);

  furniture[id] = { el, wFt, hFt, rotation:0 };
}

function createFurniture(
  name,

document.addEventListener("mousemove", e => {

  if(!draggingFurniture) return;

  const it = furniture[draggingFurniture];

    const world =
        screenToWorld(e.clientX, e.clientY);

    const nx = world.x - offset.x;
    const ny = world.y - offset.y;

  const wPx = ftToPx(it.wFt);
  const hPx = ftToPx(it.hFt);

  if(
    !overlap(
      draggingFurniture,
      nx,
      ny,
      wPx,
      hPx
    ) &&
    !collidesWithWall(
      nx,
      ny,
      wPx,
      hPx
    )
  ){
    it.el.style.left = nx + "px";
    it.el.style.top = ny + "px";
  }
});

  if(
    !overlap(
      selected,
      x,
      y,
      wPx,
      hPx
    ) &&
    !collidesWithWall(
      x,
      y,

document
  .getElementById("undo-btn")
  .onclick = () => {

  const undoStack =
    getUndoStack();

  const redoStack =
    getRedoStack();

  if (undoStack.length <= 1)
    return;

  const current =
    undoStack.pop();

  redoStack.push(current);

  restoreState(
    undoStack[
      undoStack.length - 1
    ]
  );
};

document
  .getElementById("redo-btn")
  .onclick = () => {

  const undoStack =
    getUndoStack();

  const redoStack =
    getRedoStack();

  if (redoStack.length === 0)
    return;

  const state =
    redoStack.pop();

  undoStack.push(state);

  restoreState(state);
};

document.addEventListener("keydown", e => {

  if (e.ctrlKey && e.key.toLowerCase() === "z") {

    e.preventDefault();

    document
      .getElementById("undo-btn")
      .click();
  }

  if (e.ctrlKey && e.key.toLowerCase() === "y") {

    e.preventDefault();

    document
      .getElementById("redo-btn")
      .click();
    }

    if (
        e.key === "Delete" &&
        selectedWall
    ) {

        const idx =
            interiorWalls.indexOf(
                selectedWall
            );

        if (idx !== -1) {

            interiorWalls.splice(
                idx,
                1
            );

            selectedWall = null;

            saveState();

            drawRoom();
        }
    }

    if(
      e.key === "Delete" &&
      selectedDoor
    ){

      const idx =
        doors.indexOf(
          selectedDoor
        );

      if(idx !== -1){

        doors.splice(
          idx,
          1
        );

        selectedDoor = null;

        saveState();

        drawRoom();
      }
    }
});

async function saveProject(){

  const user =
    auth.currentUser;

  if(!user){
    alert("Not logged in");
    return;
  }

  const projectName =
    currentProjectName;

  if(!projectName){
    alert("No Project Selected");
    return;
  }

  saveCurrentFloor();

  const data = {
  
    uid:
      user.uid,

    projectName,

    floors:
      JSON.parse(
        JSON.stringify(floors)
      ),

    currentFloor,

    createdAt:
      serverTimestamp()
  };

  if(currentProjectId){

    await updateDoc(

      doc(
        db,
        "projects",
        currentProjectId
      ),

      data
    );

  }else{

    const ref =
      await addDoc(

        collection(
          db,
          "projects"
        ),

        data
      );

    currentProjectId =
      ref.id;

    localStorage.setItem(
      "currentProjectId",
      ref.id
    );
  }

  Object.keys(floorUndoStacks)
    .forEach(f => {

      floorUndoStacks[f] = [];
      floorRedoStacks[f] = [];
    });

  saveCurrentFloor();

  Object.keys(floors)
    .forEach(f => {

      floorUndoStacks[f].push({

        vertices:
          JSON.parse(
            JSON.stringify(
              floors[f].vertices
            )
          ),

        interiorWalls:
          JSON.parse(
            JSON.stringify(
              floors[f].interiorWalls
            )
          ),

        doors:
          JSON.parse(
            JSON.stringify(
              floors[f].doors || []
            )
          ),

        furniture:
          JSON.parse(
            JSON.stringify(
              floors[f].furniture || {}
            )
          ),

        labels:
          JSON.parse(
            JSON.stringify(
              floors[f].roomLabels
            )
          )

      });
    });

  alert(
    "Project Saved"
  );
}

async function loadProjects(){

  const user = auth.currentUser;

  if(!user){
    alert("Not logged in");
    return;
  }

  const q = query(
    collection(db,"projects"),
    where("uid","==",user.uid)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    alert("No projects found");
    return;
  }

  let message = "Projects:\n\n";

  const projects = [];

  let index = 1;

  snap.forEach(docSnap=>{

    const data = docSnap.data();

    projects.push({
      id: docSnap.id,
      data
    });

    message +=
      index +
      ". " +
      data.projectName +
      "\n";

    index++;
  });

  const choice =
    parseInt(
      prompt(
        message +
        "\nEnter project number:"
      )
    );

  if(
    isNaN(choice) ||
    choice < 1 ||
    choice > projects.length
  ){
    return;
  }

  const selected =
    projects[choice - 1];

  const projectData =
    selected.data;

  currentProjectId =
    selected.id;

  currentProjectName =
    projectData.projectName;

  localStorage.setItem(
    "currentProjectId",
    currentProjectId
  );

  localStorage.setItem(
    "currentProjectName",
    currentProjectName
  );

  floors =
    JSON.parse(
      JSON.stringify(
        projectData.floors || {}
      )
    );

  currentFloor =
    projectData.currentFloor
    || "Ground Floor";

  loadFloor(
    currentFloor
  );

  Object.keys(floorUndoStacks)
    .forEach(f => {

      floorUndoStacks[f] = [];
      floorRedoStacks[f] = [];
    });

  Object.keys(floors)
    .forEach(f => {

      floorUndoStacks[f] = [];

      floorUndoStacks[f].push({

        vertices:
          JSON.parse(
            JSON.stringify(
              floors[f].vertices
            )
          ),

        interiorWalls:
          JSON.parse(
            JSON.stringify(
              floors[f].interiorWalls
            )
          ),

        doors:
          JSON.parse(
            JSON.stringify(
              floors[f].doors || []
            )
          ),  

        furniture:
          JSON.parse(
            JSON.stringify(
              floors[f].furniture || {}
            )
          ),

        labels:
          JSON.parse(
            JSON.stringify(
              floors[f].roomLabels
            )
          )
      });
    });

  document
    .getElementById(
      "floor-selector"
    )
    .textContent =
    currentFloor + " ▼";

  alert("Project Loaded");
}

async function deleteProject(){

  const user = auth.currentUser;

  if(!user){
    alert("Not logged in");
    return;
  }

  const q = query(
    collection(db,"projects"),
    where("uid","==",user.uid)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    alert("No projects found");
    return;
  }

  let message = "Projects:\n\n";

  const projects = [];

  let index = 1;

  snap.forEach(docSnap=>{

    const data = docSnap.data();

    projects.push({
      id: docSnap.id,
      data
    });

    message +=
      index +
      ". " +
      data.projectName +
      "\n";

    index++;
  });

  const choice =
    parseInt(
      prompt(
        message +
        "\n\nEnter project number to DELETE:"
      )
    );

  if(
    isNaN(choice) ||
    choice < 1 ||
    choice > projects.length
  ){

    doc(

}

function restoreFurniture(items){

  document
    .querySelectorAll(".furniture")
    .forEach(el => el.remove());

  furniture = {};
  nextId = 1;

  Object.values(items).forEach(item => {

    createFurniture(
      "Loaded Furniture",
      item.img,
      item.wFt,
      item.hFt,
      parseFloat(item.left) +
        ftToPx(item.wFt)/2,
      parseFloat(item.top) +
        ftToPx(item.hFt)/2
    );

    const newestId =
      "f" + (nextId - 1);

    furniture[newestId]
      .rotation =
        item.rotation || 0;

    furniture[newestId]
      .el.style.transform =
        `rotate(${item.rotation || 0}deg)`;

  });

}

function loadFloor(name){

  const floor =
    floors[name];

  if(!floor)
    return;

  vertices =
    JSON.parse(
      JSON.stringify(
        floor.vertices
      )
    );

  interiorWalls =
    JSON.parse(
      JSON.stringify(
        floor.interiorWalls
      )
    );

  doors =
    JSON.parse(
      JSON.stringify(
        floor.doors || []
      )
    );  

  roomLabels =
    JSON.parse(
      JSON.stringify(
        floor.roomLabels
      )
    );

  restoreFurniture(
    floor.furniture || {}
  );

  drawRoom();

function switchFloor(
  floorName
){

  saveCurrentFloor();

  currentFloor =
    floorName;

  loadFloor(
    floorName
  );

  if(
    getUndoStack().length === 0
  ){
      saveState();
    }

  document
    .getElementById(
      "floor-selector"
    )
    .textContent =
    floorName + " ▼";
}
