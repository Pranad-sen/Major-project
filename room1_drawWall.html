                draggable="true"
                data-name="Bed"

    <main id="main">

                    <div id="canvas">

                        <div id="resize-panel">

                            <strong>Furniture Size (ft)</strong><br>

                            Width (ft):
                            <input id="rw" type="number" step="0.1"><br>

                            Height (ft):
                            <input id="rh" type="number" step="0.1">

            </div>

        </div>                

    </main>

<div id="size-info"></div>

<script>

/* ================= CONFIG ================= */

const PIXELS_PER_FOOT = 50;

function ftToPx(ft) {
  return ft * PIXELS_PER_FOOT;
}

function pxToFt(px) {
  return px / PIXELS_PER_FOOT;
}

let wallDrawMode = false;

let scale = 1;

let panX = 0;
let panY = 0;

let isPanning = false;

let doublePanMode = false;

let lastClickTime = 0;

let startPan = {
  x:0,
  y:0
};

let wallStartPoint = null;

let interiorWalls = [];

let previewWall = null;
let selectedWall = null;

let undoStack = [];
let redoStack = [];

/* ================= WALL DRAWING ================= */

document.getElementById("draw-wall-btn").onclick = () => {

  wallDrawMode = true;

  drawWallStage = 0;

  drawWallStart = null;

  previewWall = null;

  canvas.style.cursor = "crosshair";
};

/* ================= ROOM ================= */
const svg = document.getElementById("svg");
const canvas = document.getElementById("canvas");

const workspace =
  document.getElementById("workspace");

const viewport =
  document.getElementById("viewport");

let vertices = [];
let draggingPoint = null;
let drawWallStart = null;
let drawWallStage = 0;
let lastWallClickTime = 0;

let mouseWorld = {
  x: 0,
  y: 0
};

function getClosestSegment(x, y) {

  let minDist = Infinity;

  let insertIndex = -1;

  for (let i = 0; i < vertices.length; i++) {

    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const lenSq = dx * dx + dy * dy;

    if (lenSq === 0) continue;

    /* PROJECTION */
    let t =
      ((x - a.x) * dx + (y - a.y) * dy)
      / lenSq;

    /* STRICT SEGMENT RANGE */
    if (t < 0.05 || t > 0.95) continue;

    const px = a.x + t * dx;
    const py = a.y + t * dy;

    const dist = Math.hypot(x - px, y - py);

    if (dist < minDist) {

      minDist = dist;

      insertIndex = i + 1;
    }
  }

  return {
    index: insertIndex,
    distance: minDist
  };
}

function screenToWorld(clientX, clientY) {

  const viewportRect =
    viewport.getBoundingClientRect();

  /* WORKSPACE POSITION */
  const wx =
    (clientX - viewportRect.left - panX) / scale;

  const wy =
    (clientY - viewportRect.top - panY) / scale;

  /* CANVAS POSITION INSIDE WORKSPACE */
  const canvasX = parseFloat(
    getComputedStyle(canvas).left
  );

  const canvasY = parseFloat(
    getComputedStyle(canvas).top
  );

  return {

    x: wx - canvasX,

    y: wy - canvasY
  };
}

function getNearestWallPoint(x, y) {

  let best = null;
  let bestDist = Infinity;

  /* ROOM WALLS */

  for (let i = 0; i < vertices.length; i++) {

    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const lenSq = dx * dx + dy * dy;

    if (lenSq === 0) continue;

    let t =
      ((x - a.x) * dx +
       (y - a.y) * dy) / lenSq;

    t = Math.max(0, Math.min(1, t));

    const px = a.x + t * dx;
    const py = a.y + t * dy;

    const dist =
      Math.hypot(
        x - px,
        y - py
      );

    if (dist < bestDist) {

      bestDist = dist;

      best = {
        x: px,
        y: py
      };
    }
  }

  /* INTERIOR WALLS */

  interiorWalls.forEach(w => {

    const dx = w.x2 - w.x1;
    const dy = w.y2 - w.y1;

    const lenSq =
      dx * dx + dy * dy;

    if (lenSq === 0) return;

    let t =
      ((x - w.x1) * dx +
       (y - w.y1) * dy) / lenSq;

    t = Math.max(0, Math.min(1, t));

    const px =
      w.x1 + t * dx;

    const py =
      w.y1 + t * dy;

    const dist =
      Math.hypot(
        x - px,
        y - py
      );

    if (dist < bestDist) {

      bestDist = dist;

      best = {
        x: px,
        y: py
      };
    }

  });

  return best;
}

function saveState() {

    const newState = {

        vertices:
            JSON.parse(JSON.stringify(vertices)),

        interiorWalls:
            JSON.parse(
                JSON.stringify(interiorWalls)
            ),

        furniture:
            JSON.parse(
                JSON.stringify(
                    getFurnitureSnapshot()
                )
            )
    };

  if (undoStack.length > 0) {

    const lastState =
      JSON.stringify(
        undoStack[
          undoStack.length - 1
        ]
      );

    const currentState =
      JSON.stringify(newState);

    if (lastState === currentState)
      return;
  }

  undoStack.push(newState);

  if (undoStack.length > 50) {
    undoStack.shift();
  }

  redoStack = [];
}

function getFurnitureSnapshot() {

  const furnitureState = {};

  for (const id in furniture) {

    furnitureState[id] = {

      left: furniture[id].el.style.left,
      top: furniture[id].el.style.top,

      wFt: furniture[id].wFt,
      hFt: furniture[id].hFt,

      img:
        furniture[id]
          .el
          .querySelector("img")
          .src
    };
  }

  return furnitureState;
}

function restoreState(state) {

  vertices =
    JSON.parse(
      JSON.stringify(state.vertices)
    );

  interiorWalls =
    JSON.parse(
        JSON.stringify(
            state.interiorWalls || []
        )
    );  

  furnitureLayer.innerHTML = "";

  furniture = {};

  for (const id in state.furniture) {

  const item =
    state.furniture[id];

  const x =
    parseFloat(item.left);

  const y =
    parseFloat(item.top);

  createFurnitureElement(
    "",
    item.img,
    item.wFt,
    item.hFt,
    x + ftToPx(item.wFt)/2,
    y + ftToPx(item.hFt)/2
  );
}

  selected = null;

  resizePanel.style.display = "none";

  drawRoom();
}

function updateWorkspaceTransform() {

  workspace.style.transform =
    `translate(${panX}px, ${panY}px)
     scale(${scale})`;
}

function initRoom() {

  const r = canvas.getBoundingClientRect();

  if (r.width === 0 || r.height === 0) return;

  const w = Math.min(400, r.width * 0.6);
  const h = Math.min(300, r.height * 0.6);
  const cx = r.width / 2;
  const cy = r.height / 2;

  vertices = [
    {x: cx-w/2, y: cy-h/2},
    {x: cx+w/2, y: cy-h/2},
    {x: cx+w/2, y: cy+h/2},
    {x: cx-w/2, y: cy+h/2}
  ];
  drawRoom();
}

function drawRoom() {

  svg.innerHTML = "";

  /* ===== ARROW DEFINITIONS ===== */

  const defs =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "defs"
    );

  /* LEFT ARROW */

  const leftArrow =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "marker"
    );

  leftArrow.setAttribute(
    "id",
    "leftArrow"
  );

  leftArrow.setAttribute(
    "markerWidth",
    "5"
  );

  leftArrow.setAttribute(
    "markerHeight",
    "5"
  );

  leftArrow.setAttribute(
    "refX",
    "2.5"
  );

  leftArrow.setAttribute(
    "refY",
    "2.5"
  );

  leftArrow.setAttribute(
    "orient",
    "auto"
  );

  const leftPath =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  leftPath.setAttribute(
    "d",
    "M5,0 L0,2.5 L5,5 Z"
  );

  leftPath.setAttribute(
    "fill",
    "#999"
  );

  leftArrow.appendChild(
    leftPath
  );

  /* RIGHT ARROW */

  const rightArrow =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "marker"
    );

  rightArrow.setAttribute(
    "id",
    "rightArrow"
  );

  rightArrow.setAttribute(
    "markerWidth",
    "5"
  );

  rightArrow.setAttribute(
    "markerHeight",
    "5"
  );

  rightArrow.setAttribute(
    "refX",
    "2.5"
  );

  rightArrow.setAttribute(
    "refY",
    "2.5"
  );

  rightArrow.setAttribute(
    "orient",
    "auto"
  );

  const rightPath =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  rightPath.setAttribute(
    "d",
    "M0,0 L5,2.5 L0,5 Z"
  );

  rightPath.setAttribute(
    "fill",
    "#999"
  );

  rightArrow.appendChild(
    rightPath
  );

  defs.appendChild(leftArrow);
  defs.appendChild(rightArrow);

  svg.appendChild(defs);

/* ===== CREATE ONE ROOM PATH ===== */

const path = document.createElementNS(
  "http://www.w3.org/2000/svg",
  "path"
);

let d = `M ${vertices[0].x} ${vertices[0].y}`;

for (let j = 1; j < vertices.length; j++) {
  d += ` L ${vertices[j].x} ${vertices[j].y}`;
}

/* CLOSE ROOM */
d += " Z";

path.setAttribute("d", d);
path.setAttribute("fill", "none");
path.setAttribute("stroke", "#555");
path.setAttribute("stroke-width", "4");
path.setAttribute("class", "wall");

svg.appendChild(path);

/* ===== INTERIOR WALLS ===== */

interiorWalls.forEach(w => {

  const line =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  line.setAttribute("x1", w.x1);
  line.setAttribute("y1", w.y1);

  line.setAttribute("x2", w.x2);
  line.setAttribute("y2", w.y2);

  line.setAttribute(
    "stroke",
    selectedWall === w
        ? "#4a90e2"
        : "#555"
  );
  line.setAttribute("stroke-width", "4");

  svg.appendChild(line);
});

/* ===== PREVIEW WALL ===== */

if (previewWall) {

  const preview =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  preview.setAttribute(
    "x1",
    previewWall.x1
  );

  preview.setAttribute(
    "y1",
    previewWall.y1
  );

  preview.setAttribute(
    "x2",
    previewWall.x2
  );

  preview.setAttribute(
    "y2",
    previewWall.y2
  );

  preview.setAttribute(
    "stroke",
    "#4a90e2"
  );

  preview.setAttribute(
    "stroke-width",
    "3"
  );

  preview.setAttribute(
    "stroke-dasharray",
    "8 6"
  );

  svg.appendChild(preview);

  const previewLenFt =
    Math.hypot(
        previewWall.x2 - previewWall.x1,
        previewWall.y2 - previewWall.y1
    ) / PIXELS_PER_FOOT;

    const previewText =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    previewText.setAttribute(
        "x",
        (previewWall.x1 + previewWall.x2) / 2
    );

    previewText.setAttribute(
        "y",
        (previewWall.y1 + previewWall.y2) / 2 - 20
    );

    previewText.setAttribute(
        "text-anchor",
        "middle"
    );

    previewText.setAttribute(
        "class",
        "wall-label"
    );

    previewText.textContent =
        previewLenFt.toFixed(1) + " ft";

    svg.appendChild(previewText);
}

/* ===== INTERIOR WALL DIMENSIONS ===== */

interiorWalls.forEach(w => {

    if (selectedWall !== w)
        return;

  const dx = w.x2 - w.x1;
  const dy = w.y2 - w.y1;

  const wallLength =
    Math.hypot(dx, dy);

  if (wallLength === 0)
    return;

  const lenFt =
    wallLength / PIXELS_PER_FOOT;

    let nx = -dy / wallLength;
    let ny = dx / wallLength;

    /* FORCE DIMENSIONS OUTSIDE */

    if (Math.abs(dx) > Math.abs(dy)) {

        /* horizontal wall */

        nx = 0;
        ny = -1;

    } else {

        /* vertical wall */

        nx = -1;
        ny = 0;
    }

    const offset = 15;

  const ax =
    w.x1 + nx * offset;

  const ay =
    w.y1 + ny * offset;

  const bx =
    w.x2 + nx * offset;

  const by =
    w.y2 + ny * offset;

  const dimLine =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  dimLine.setAttribute(
    "x1",
    ax
  );

  dimLine.setAttribute(
    "y1",
    ay
  );

  dimLine.setAttribute(
    "x2",
    bx
  );

  dimLine.setAttribute(
    "y2",
    by
  );

  dimLine.setAttribute(
    "stroke",
    selectedWall === w
      ? "#4a90e2"
      : "#999"
  );

  dimLine.setAttribute(
    "stroke-width",
    "1"
  );

  dimLine.setAttribute(
    "marker-start",
    "url(#leftArrow)"
  );

  dimLine.setAttribute(
    "marker-end",
    "url(#rightArrow)"
  );

  svg.appendChild(dimLine);

  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  text.setAttribute(
    "x",
    (ax + bx) / 2 +
      nx * 20
  );

  text.setAttribute(
    "y",
    (ay + by) / 2 +
      ny * 20
  );

  text.setAttribute(
    "text-anchor",
    "middle"
  );

  text.setAttribute(
    "dominant-baseline",
    "middle"
  );

  text.setAttribute(
    "class",
    "wall-label"
  );

  text.textContent =
    lenFt.toFixed(1) + " ft";

  svg.appendChild(text);
});

/* ===== DIMENSIONS ===== */

for (let i = 0; i < vertices.length; i++) {

  const a = vertices[i];
  const b = vertices[(i + 1) % vertices.length];

  const len =
    Math.hypot(
      b.x - a.x,
      b.y - a.y
    ) / PIXELS_PER_FOOT;

  const dx = b.x - a.x;
  const dy = b.y - a.y;

  const wallLength =
    Math.hypot(dx, dy);

  let nx = -dy / wallLength;
  let ny = dx / wallLength;

  const roomCenterX =
    vertices.reduce((s,p)=>s+p.x,0)
    / vertices.length;

  const roomCenterY =
    vertices.reduce((s,p)=>s+p.y,0)
    / vertices.length;

  const wallMidX =
    (a.x + b.x) / 2;

  const wallMidY =
    (a.y + b.y) / 2;

  const testX =
    wallMidX + nx * 50;

  const testY =
    wallMidY + ny * 50;

  const distCurrent =
    Math.hypot(
      testX - roomCenterX,
      testY - roomCenterY
    );

  const distWall =
    Math.hypot(
      wallMidX - roomCenterX,
      wallMidY - roomCenterY
    );

  if (distCurrent < distWall) {

    nx *= -1;
    ny *= -1;
  }

  const offset = 15;

  const ax = a.x + nx * offset;
  const ay = a.y + ny * offset;

  const bx = b.x + nx * offset;
  const by = b.y + ny * offset;

  /* LEFT EXTENSION */

  const ext1 =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  ext1.setAttribute("x1", a.x);
  ext1.setAttribute("y1", a.y);

  ext1.setAttribute("x2", ax);
  ext1.setAttribute("y2", ay);

  ext1.setAttribute("stroke", "#aaa");
  ext1.setAttribute("stroke-width", "1");

  svg.appendChild(ext1);

  /* RIGHT EXTENSION */

  const ext2 =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  ext2.setAttribute("x1", b.x);
  ext2.setAttribute("y1", b.y);

  ext2.setAttribute("x2", bx);
  ext2.setAttribute("y2", by);

  ext2.setAttribute("stroke", "#aaa");
  ext2.setAttribute("stroke-width", "1");

  svg.appendChild(ext2);

  /* DIMENSION LINE */

  const dimLine =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  dimLine.setAttribute("x1", ax);
  dimLine.setAttribute("y1", ay);

  dimLine.setAttribute("x2", bx);
  dimLine.setAttribute("y2", by);

  dimLine.setAttribute("stroke", "#999");
  dimLine.setAttribute("stroke-width", "1.5");

  dimLine.setAttribute(
    "marker-start",
    "url(#leftArrow)"
  );

  dimLine.setAttribute(
    "marker-end",
    "url(#rightArrow)"
  );

  svg.appendChild(dimLine);

  /* TEXT */

  const t =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  const textoffset = 15;

  t.setAttribute("x", (ax + bx) / 2 + nx * textoffset);
  t.setAttribute("y", (ay + by) / 2 + ny * textoffset);

  t.setAttribute(
    "text-anchor",
    "middle"
  );

  t.setAttribute(
    "dominant-baseline",
    "middle"
  );

  t.setAttribute(
    "class",
    "wall-label"
  );

  t.textContent =
    len.toFixed(1) + " ft";

  svg.appendChild(t);
}

  vertices.forEach((p,i)=>{

    const c = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", 6);
    c.setAttribute("class", "point");

    c.onmousedown = e => {

      e.stopPropagation();

      draggingPoint = i;
    };

    c.oncontextmenu = e => {

      e.preventDefault();

      if (vertices.length > 3) {
        vertices.splice(i,1);
        drawRoom();
        saveState();
      }
    };
    svg.appendChild(c);
  });
}

document.addEventListener("mousemove", e => {

  if (draggingPoint === null) return;

  if (e.buttons === 0) {

    draggingPoint = null;

    return;
  }

  const r = canvas.getBoundingClientRect();

  const grid = 20;

  let nx = e.clientX - r.left;
  let ny = e.clientY - r.top;

  //grid snapping//
  nx = Math.round(nx / grid) * grid;
  ny = Math.round(ny / grid) * grid;

  vertices[draggingPoint].x = nx;
  vertices[draggingPoint].y = ny;

  drawRoom();
});

document.addEventListener("mousemove", e => {

  if (!wallDrawMode) return;

  const world =
    screenToWorld(
      e.clientX,
      e.clientY
    );

  const grid = 20;

  mouseWorld.x =
    Math.round(world.x / grid) * grid;

  mouseWorld.y =
    Math.round(world.y / grid) * grid;

  if (drawWallStart) {

    previewWall = {

      x1: drawWallStart.x,
      y1: drawWallStart.y,

      x2: mouseWorld.x,
      y2: mouseWorld.y
    };

    drawRoom();
  }
});

document.addEventListener("mouseup", () => {

  if (draggingPoint !== null) {

    saveState();

    draggingPoint = null;
  }

  if (draggingFurniture) {

    saveState();

    draggingFurniture = null;
  }
});

/* ================= PANNING ================= */

viewport.addEventListener("mousedown", e => {

  const now = Date.now();

  const clickedFurniture =
    e.target.closest(".furniture");

  const clickedPoint =
    e.target.closest(".point");

  /* IGNORE OBJECT INTERACTIONS */
  if (clickedFurniture || clickedPoint) return;

  /* DOUBLE CLICK PAN */
  if (now - lastClickTime < 300) {

    doublePanMode = true;

    isPanning = true;

    startPan.x = e.clientX - panX;
    startPan.y = e.clientY - panY;

    viewport.style.cursor = "grabbing";
  }

  lastClickTime = now;

  /* SPACEBAR OR MIDDLE MOUSE */
  if (e.button === 1 || spacePressed) {

    isPanning = true;

    startPan.x = e.clientX - panX;
    startPan.y = e.clientY - panY;

    viewport.style.cursor = "grabbing";
  }
});

document.addEventListener("mousemove", e => {

  if (!isPanning) return;

  panX = e.clientX - startPan.x;
  panY = e.clientY - startPan.y;

  updateWorkspaceTransform();
});

document.addEventListener("mouseup", () => {

  isPanning = false;

  doublePanMode = false;

  viewport.style.cursor = "default";
});

/* ================= ZOOM ================= */

viewport.addEventListener("wheel", e => {

  e.preventDefault();

  const rect =
    viewport.getBoundingClientRect();

  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const wx = (mx - panX) / scale;
  const wy = (my - panY) / scale;

  /* SYMMETRIC ZOOM */
  const zoomIntensity = 0.0045;

  const zoom =
    Math.exp(-e.deltaY * zoomIntensity);

  scale *= zoom;

  scale = Math.max(0.2, Math.min(4, scale));

  panX = mx - wx * scale;
  panY = my - wy * scale;

  updateWorkspaceTransform();

}, { passive:false });

svg.addEventListener("click", e => {

  if (!wallDrawMode) return;

    const now = Date.now();

    if (
        drawWallStage === 1 &&
        now - lastWallClickTime < 300
    ) {

        wallDrawMode = false;

        drawWallStage = 0;

        drawWallStart = null;

        previewWall = null;

        canvas.style.cursor = "default";

        drawRoom();

        return;
    }

    lastWallClickTime = now;

  const world =
    screenToWorld(
      e.clientX,
      e.clientY
    );

  const grid = 20;

  const x =
    Math.round(world.x / grid) * grid;

  const y =
    Math.round(world.y / grid) * grid;

  /* FIRST CLICK */

    if (drawWallStage === 0) {

        const snap =
            getNearestWallPoint(
                x,
                y
            );

    if (!snap) return;

    const maxDistance = 40;

    if (
        Math.hypot(
            x - snap.x,
            y - snap.y
        ) > maxDistance
    ) {
        return;
    }

    drawWallStart = {

        x:
            Math.round(snap.x / 20) * 20,

        y:
            Math.round(snap.y / 20) * 20
    };

    drawWallStage = 1;

    return;
}

  /* SECOND CLICK */

    let endX = x;
    let endY = y;

    /* SNAP ENDPOINT TO WALLS */

    const endSnap =
        getNearestWallPoint(
            x,
            y
        );

    if (
        endSnap &&
        Math.hypot(
            x - endSnap.x,
            y - endSnap.y
        ) < 40
    ) {

        endX =
            Math.round(endSnap.x / 20) * 20;

        endY =
            Math.round(endSnap.y / 20) * 20;
    }

    interiorWalls.push({

        x1: drawWallStart.x,
        y1: drawWallStart.y,

        x2: endX,
        y2: endY
    });

    saveState();

    drawWallStart = {

        x: endX,
        y: endY
    };

    previewWall = null;

    drawRoom();
});

svg.addEventListener("mousedown", e => {

  if (wallDrawMode) return;

  const world =
    screenToWorld(
      e.clientX,
      e.clientY
    );

  selectedWall = null;

  for (const w of interiorWalls) {

    const dx = w.x2 - w.x1;
    const dy = w.y2 - w.y1;

    const lenSq =
      dx * dx + dy * dy;

    if (lenSq === 0)
      continue;

    let t =
      ((world.x - w.x1) * dx +
       (world.y - w.y1) * dy)
      / lenSq;

    t = Math.max(
      0,
      Math.min(1, t)
    );

    const px =
      w.x1 + t * dx;

    const py =
      w.y1 + t * dy;

    const dist =
      Math.hypot(
        world.x - px,
        world.y - py
      );

    if (dist < 10) {

      selectedWall = w;

      break;
    }
  }

  drawRoom();
});

/* ================= FURNITURE ================= */

const furnitureLayer = document.getElementById("furniture-layer");
const resizePanel = document.getElementById("resize-panel");

const rw = document.getElementById("rw");
const rh = document.getElementById("rh");

let furniture = {};
let nextId = 1;

let draggingFurniture = null;
let offset = {};
let selected = null;
let moveMode = false;

function pointInPolygon(p, poly) {

  let inside = false;

  for (let i=0,j=poly.length-1;i<poly.length;j=i++) {

    const xi=poly[i].x, yi=poly[i].y;
    const xj=poly[j].x, yj=poly[j].y;

    const intersect =
      ((yi>p.y)!=(yj>p.y)) &&
      (p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

function rectInsidePolygon(x, y, w, h, poly) {

  const corners = [
    { x:x, y:y },
    { x:x+w, y:y },
    { x:x+w, y:y+h },
    { x:x, y:y+h }
  ];

  return corners.every(pt => pointInPolygon(pt, poly));
}

function overlap(id,x,y,w,h){

  for(const k in furniture){

    if(k===id) continue;

    const o=furniture[k];

    const ox=parseFloat(o.el.style.left);
    const oy=parseFloat(o.el.style.top);

    const ow = ftToPx(o.wFt);
    const oh = ftToPx(o.hFt);

    if (
      x < ox + ow &&
      x + w > ox &&
      y < oy + oh &&
      y + h > oy
    ) {
      return true;
    }
  }

  return false;
}

function createFurnitureElement(name,img,wFt,hFt,x,y){

  const id = "f" + nextId++;

  const el = document.createElement("div");

  el.className = "furniture";

  const wPx = ftToPx(wFt);
  const hPx = ftToPx(hFt);

  el.style.width = wPx + "px";
  el.style.height = hPx + "px";

  el.style.left = x - wPx/2 + "px";
  el.style.top = y - hPx/2 + "px";

  furniture[id] = { el, wFt, hFt };

  el.innerHTML = `
    <img src="${img}">
  `;

  const ctr = document.createElement("div");
  ctr.className = "f-controls";

  const del = document.createElement("button");
  del.textContent = "✕";

  ctr.appendChild(del);

  el.appendChild(ctr);

  del.onclick = e => {

    e.stopPropagation();

    el.remove();

    delete furniture[id];

    resizePanel.style.display = "none";

    saveState();
  };

  el.onmousedown = e => {

    if(!moveMode) return;

    e.stopPropagation();

    draggingFurniture = id;
    selected = id;
    document.querySelectorAll(".furniture")
      .forEach(f => f.classList.remove("selected"));

    el.classList.add("selected");

    rw.value = furniture[id].wFt;
    rh.value = furniture[id].hFt;

    resizePanel.style.display = "block";

    const world =
        screenToWorld(e.clientX, e.clientY);

    const left =
        parseFloat(el.style.left);

    const top =
        parseFloat(el.style.top);

    offset.x = world.x - left;
    offset.y = world.y - top;
  };

  furnitureLayer.appendChild(el);

  furniture[id] = { el, wFt, hFt };
}

function createFurniture(
  name,
  img,
  wFt,
  hFt,
  x,
  y
){
  createFurnitureElement(
    name,
    img,
    wFt,
    hFt,
    x,
    y
  );
}

document.addEventListener("mousemove", e => {

  if(!draggingFurniture) return;

  const it = furniture[draggingFurniture];

    const world =
        screenToWorld(e.clientX, e.clientY);

    const nx = world.x - offset.x;
    const ny = world.y - offset.y;

  const wPx = ftToPx(it.wFt);
  const hPx = ftToPx(it.hFt);

  if(
    rectInsidePolygon(nx,ny,wPx,hPx,vertices) &&
    !overlap(draggingFurniture,nx,ny,wPx,hPx)
  ){
    it.el.style.left = nx + "px";
    it.el.style.top = ny + "px";
  }
});

document.addEventListener("mouseup", () => {
  draggingFurniture = null;
});

rw.onchange = rh.onchange = () => {

  if(!selected) return;

  const it = furniture[selected];

  const wFt = Math.round(Number(rw.value));
  const hFt = Math.round(Number(rh.value));

  const x = parseFloat(it.el.style.left);
  const y = parseFloat(it.el.style.top);

  const wPx = ftToPx(wFt);
  const hPx = ftToPx(hFt);

  if(
    rectInsidePolygon(x,y,wPx,hPx,vertices) &&
    !overlap(selected,x,y,wPx,hPx)
  ){

    it.wFt = wFt;
    it.hFt = hFt;

    it.el.style.width = wPx + "px";
    it.el.style.height = hPx + "px";
    saveState();

  } else {

    rw.value = it.wFt;
    rh.value = it.hFt;
  }
};

document.querySelectorAll(".f-item").forEach(i => {

  i.ondragstart = () => {

    window.dragData = {
      n: i.dataset.name,
      img: i.dataset.img,
      w: +i.dataset.w,
      h: +i.dataset.h
    };
  };
});

canvas.ondragover = e => e.preventDefault();

canvas.ondrop = e => {

  const world =
    screenToWorld(e.clientX, e.clientY);

  createFurniture(
    dragData.n,
    dragData.img,
    dragData.w,
    dragData.h,
    world.x,
    world.y
  );
  saveState();
};

window.addEventListener("load", () => {

    initRoom();

    drawRoom();

    saveState();

    const viewportRect =
        viewport.getBoundingClientRect();

    const canvasRect =
        canvas.getBoundingClientRect();

    /* CENTER CANVAS INSIDE VIEWPORT */
    panX =
        viewportRect.width / 2
        - 2400;

    panY =
        viewportRect.height / 2
        - 2250;

    updateWorkspaceTransform();
});

window.addEventListener("resize", initRoom);

document
  .getElementById("undo-btn")
  .onclick = () => {

  if (undoStack.length <= 1)
    return;

  const current =
    undoStack.pop();

  redoStack.push(current);

  restoreState(
    undoStack[
      undoStack.length - 1
    ]
  );
};

document
  .getElementById("redo-btn")
  .onclick = () => {

  if (redoStack.length === 0)
    return;

  const state =
    redoStack.pop();

  undoStack.push(state);

  restoreState(state);
};

document.addEventListener("keydown", e => {

  if (e.ctrlKey && e.key.toLowerCase() === "z") {

    e.preventDefault();

    document
      .getElementById("undo-btn")
      .click();
  }

  if (e.ctrlKey && e.key.toLowerCase() === "y") {

    e.preventDefault();

    document
      .getElementById("redo-btn")
      .click();
    }

    if (
        e.key === "Delete" &&
        selectedWall
    ) {

        const idx =
            interiorWalls.indexOf(
                selectedWall
            );

        if (idx !== -1) {

            interiorWalls.splice(
                idx,
                1
            );

            selectedWall = null;

            saveState();

            drawRoom();
        }
    }
});

const sizeInfo = document.getElementById("size-info");

const moveBtn = document.getElementById("move-furniture-btn");
const doneBtn = document.getElementById("done-move-btn");

moveBtn.onclick = () => {
  moveMode = true;
  moveBtn.style.display = "none";
  doneBtn.style.display = "block";

  document.querySelectorAll(".furniture")
    .forEach(f => f.style.cursor = "move");
  };

  doneBtn.onclick = () => {
    moveMode = false;
    moveBtn.style.display = "block";
    doneBtn.style.display = "none";

    draggingFurniture = null;

    document.querySelectorAll(".furniture").forEach(f => {
      f.classList.remove("selected");
      f.style.cursor = "default";
    });

    resizePanel.style.display = "none";
  };

/* ================= SIDEBAR PANELS ================= */

const sidebarItems =
  document.querySelectorAll(".sidebar-item");

const toolPanel =
  document.getElementById("tool-panel");

const furnishPanel =
  document.getElementById("furnish-panel");

const editPanel =
  document.getElementById("edit-panel");

/* DEFAULT */
furnishPanel.classList.add("active");

document.getElementById("furnish-tab")
.onclick = () => {

  sidebarItems.forEach(i =>
    i.classList.remove("active"));

  document.getElementById("furnish-tab")
    .classList.add("active");

  furnishPanel.classList.add("active");

  editPanel.classList.remove("active");

  toolPanel.style.transform = "translateX(0)";
};

document.getElementById("edit-tab")
.onclick = () => {

  sidebarItems.forEach(i =>
    i.classList.remove("active"));

  document.getElementById("edit-tab")
    .classList.add("active");

  editPanel.classList.add("active");

  furnishPanel.classList.remove("active");

  toolPanel.style.transform = "translateX(0)";
};

function updateSizeInfo(w,h){

  const wf = (w / PIXELS_PER_FOOT).toFixed(2);
  const hf = (h / PIXELS_PER_FOOT).toFixed(2);

  sizeInfo.textContent = `${wf} ft × ${hf} ft`;
}
