<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Roomify – 2D Room Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="room1_rebuild.css">

</head>

<body>

<header id="topbar">

  <!-- LEFT SECTION -->
  <div id="topbar-left">

    <div class="top-btn" id="floor-selector">

    <div class="top-icon-btn" id="add-floor-btn">

    </div>

    <div class="top-icon-btn" id="undo-btn">

    </div>

    <div class="top-icon-btn" id="redo-btn">
      ↷
    </div>

  </div>

  <!-- RIGHT SECTION -->
  <div id="topbar-right">

    <div class="top-icon-btn">
      🖨 Print
    </div>

    <div class="top-icon-btn">

    </div>

    <div id="profile-btn">
      <div id="profile-avatar">
        U
      </div>

      <div id="profile-hover-menu">

        <div class="profile-item">
          My Projects
        </div>

        <div class="profile-item">

        </div>

        <div class="profile-item">

        </div>

      </div>

</header>

<div id="app">

    <aside id="sidebar">

        <div class="sidebar-item active" id="search-tab">
            🔍
            <span>Search</span>
        </div>

        <div class="sidebar-item" id="build-tab">
            🏗
            <span>Build</span>
        </div>

        <div class="sidebar-item" id="furnish-tab">
            🛋
            <span>Furnish</span>
        </div>

        <div class="sidebar-item" id="outdoor-tab">
            🌳
            <span>Outdoor</span>
        </div>

        <div class="sidebar-item" id="edit-tab">
            ✏️
            <span>Edit</span>
        </div>
    </aside>

    <!-- TEMP CONTENT PANEL -->

    <div id="tool-panel">

        <!-- EDIT PANEL -->
        <div class="panel-section" id="edit-panel">

            <button id="draw-wall-btn">
                Draw Wall
            </button>

            <button id="move-furniture-btn">
                Move Furniture
            </button>

            <button id="done-move-btn" style="display:none;">
                ✓ Done
            </button>
        </div>

        <!-- FURNISH PANEL -->
        <div class="panel-section" id="furnish-panel">

            <h3>Furniture</h3>

            <div class="f-item"
                draggable="true"
                data-name="Chair"
                data-img="images/furniture/chair.png"
                data-w="1.5"
                data-h="1.5">

                <img src="images/furniture/chair.png">
            </div>

            <div class="f-item"
                draggable="true"
                data-name="table"
                data-img="images/furniture/table.png"
                data-w="3"
                data-h="3">

                <img src="images/furniture/table.png">
            </div>

            <div class="f-item"
                draggable="true"
                data-name="Bed"
                data-img="images/furniture/bed.png"
                data-w="6"
                data-h="3">

                <img src="images/furniture/bed.png">
            </div>

        </div>

    </div>

    <main id="main">

        <div id = "viewport">

            <div id = "workspace">

                    <div id="canvas">

                        <svg id="svg"></svg>

                        <div id="furniture-layer"></div>

                        <div id="resize-panel">

                            <strong>Furniture Size (ft)</strong><br>

                            Width (ft):
                            <input id="rw" type="number" step="0.1"><br>

                            Height (ft):
                            <input id="rh" type="number" step="0.1">

                        </div>

                    </div>
        
            </div>

        </div>                

    </main>

    </div>

<div id="size-info"></div>

<script>

/* ================= CONFIG ================= */

const PIXELS_PER_FOOT = 50;

function ftToPx(ft) {
  return ft * PIXELS_PER_FOOT;
}

function pxToFt(px) {
  return px / PIXELS_PER_FOOT;
}

let wallDrawMode = false;

let scale = 1;

let panX = 0;
let panY = 0;

let isPanning = false;

let doublePanMode = false;

let lastClickTime = 0;

let startPan = {
  x:0,
  y:0
};

let wallStartPoint = null;

/* ================= WALL DRAWING ================= */

document.getElementById("draw-wall-btn").onclick = () => {

  wallDrawMode = true;

  canvas.style.cursor = "crosshair";
};

/* ================= ROOM ================= */
const svg = document.getElementById("svg");
const canvas = document.getElementById("canvas");

const workspace =
  document.getElementById("workspace");

const viewport =
  document.getElementById("viewport");

let vertices = [];
let draggingPoint = null;

function getClosestSegment(x, y) {

  let minDist = Infinity;

  let insertIndex = -1;

  for (let i = 0; i < vertices.length; i++) {

    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const lenSq = dx * dx + dy * dy;

    if (lenSq === 0) continue;

    /* PROJECTION */
    let t =
      ((x - a.x) * dx + (y - a.y) * dy)
      / lenSq;

    /* STRICT SEGMENT RANGE */
    if (t < 0.05 || t > 0.95) continue;

    const px = a.x + t * dx;
    const py = a.y + t * dy;

    const dist = Math.hypot(x - px, y - py);

    if (dist < minDist) {

      minDist = dist;

      insertIndex = i + 1;
    }
  }

  return {
    index: insertIndex,
    distance: minDist
  };
}

function screenToWorld(clientX, clientY) {

  const viewportRect =
    viewport.getBoundingClientRect();

  /* WORKSPACE POSITION */
  const wx =
    (clientX - viewportRect.left - panX) / scale;

  const wy =
    (clientY - viewportRect.top - panY) / scale;

  /* CANVAS POSITION INSIDE WORKSPACE */
  const canvasX = parseFloat(
    getComputedStyle(canvas).left
  );

  const canvasY = parseFloat(
    getComputedStyle(canvas).top
  );

  return {

    x: wx - canvasX,

    y: wy - canvasY
  };
}

function updateWorkspaceTransform() {

  workspace.style.transform =
    `translate(${panX}px, ${panY}px)
     scale(${scale})`;
}

function initRoom() {

  const r = canvas.getBoundingClientRect();

  if (r.width === 0 || r.height === 0) return;

  const w = Math.min(400, r.width * 0.6);
  const h = Math.min(300, r.height * 0.6);
  const cx = r.width / 2;
  const cy = r.height / 2;

  vertices = [
    {x: cx-w/2, y: cy-h/2},
    {x: cx+w/2, y: cy-h/2},
    {x: cx+w/2, y: cy+h/2},
    {x: cx-w/2, y: cy+h/2}
  ];
  drawRoom();
}

function drawRoom() {

  svg.innerHTML = "";

/* ===== CREATE ONE ROOM PATH ===== */

const path = document.createElementNS(
  "http://www.w3.org/2000/svg",
  "path"
);

let d = `M ${vertices[0].x} ${vertices[0].y}`;

for (let j = 1; j < vertices.length; j++) {
  d += ` L ${vertices[j].x} ${vertices[j].y}`;
}

/* CLOSE ROOM */
d += " Z";

path.setAttribute("d", d);
path.setAttribute("fill", "none");
path.setAttribute("stroke", "#555");
path.setAttribute("stroke-width", "4");
path.setAttribute("class", "wall");

svg.appendChild(path);

/* ===== WALL LABELS ===== */

for (let i = 0; i < vertices.length; i++) {

  const a = vertices[i];
  const b = vertices[(i + 1) % vertices.length];

  const len =
    Math.hypot(b.x-a.x, b.y-a.y) / PIXELS_PER_FOOT;

  const t = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "text"
  );

  t.setAttribute("x", (a.x+b.x)/2);
  t.setAttribute("y", (a.y+b.y)/2 - 6);
  t.setAttribute("class", "wall-label");

  t.textContent = len.toFixed(1) + " ft";

  svg.appendChild(t);
}

  vertices.forEach((p,i)=>{

    const c = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", 6);
    c.setAttribute("class", "point");

    c.onmousedown = () => draggingPoint = i;

    c.oncontextmenu = e => {

      e.preventDefault();

      if (vertices.length > 3) {
        vertices.splice(i,1);
        drawRoom();
      }
    };
    svg.appendChild(c);
  });
}

document.addEventListener("mousemove", e => {

  if (draggingPoint === null) return;

  const r = canvas.getBoundingClientRect();

  const grid = 20;

  let nx = e.clientX - r.left;
  let ny = e.clientY - r.top;

  //grid snapping//
  nx = Math.round(nx / grid) * grid;
  ny = Math.round(ny / grid) * grid;

  vertices[draggingPoint].x = nx;
  vertices[draggingPoint].y = ny;

  drawRoom();
});

document.addEventListener("mouseup", () => {
  draggingPoint = null;
});

/* ================= PANNING ================= */

viewport.addEventListener("mousedown", e => {

  const now = Date.now();

  const clickedFurniture =
    e.target.closest(".furniture");

  const clickedPoint =
    e.target.closest(".point");

  /* IGNORE OBJECT INTERACTIONS */
  if (clickedFurniture || clickedPoint) return;

  /* DOUBLE CLICK PAN */
  if (now - lastClickTime < 300) {

    doublePanMode = true;

    isPanning = true;

    startPan.x = e.clientX - panX;
    startPan.y = e.clientY - panY;

    viewport.style.cursor = "grabbing";
  }

  lastClickTime = now;

  /* SPACEBAR OR MIDDLE MOUSE */
  if (e.button === 1 || spacePressed) {

    isPanning = true;

    startPan.x = e.clientX - panX;
    startPan.y = e.clientY - panY;

    viewport.style.cursor = "grabbing";
  }
});

document.addEventListener("mousemove", e => {

  if (!isPanning) return;

  panX = e.clientX - startPan.x;
  panY = e.clientY - startPan.y;

  updateWorkspaceTransform();
});

document.addEventListener("mouseup", () => {

  isPanning = false;

  doublePanMode = false;

  viewport.style.cursor = "default";
});

/* ================= ZOOM ================= */

viewport.addEventListener("wheel", e => {

  e.preventDefault();

  const rect =
    viewport.getBoundingClientRect();

  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const wx = (mx - panX) / scale;
  const wy = (my - panY) / scale;

  /* SYMMETRIC ZOOM */
  const zoomIntensity = 0.0045;

  const zoom =
    Math.exp(-e.deltaY * zoomIntensity);

  scale *= zoom;

  scale = Math.max(0.2, Math.min(4, scale));

  panX = mx - wx * scale;
  panY = my - wy * scale;

  updateWorkspaceTransform();

}, { passive:false });



svg.addEventListener("click", e => {

  if (!wallDrawMode) return;

  if (e.target.closest(".furniture")) return;

  const world =
    screenToWorld(e.clientX, e.clientY);

  const result =
    getClosestSegment(world.x, world.y);

  /* CLICK NOT CLOSE ENOUGH */
  if (result.distance > 40) {

    wallDrawMode = false;

    canvas.style.cursor = "default";

    return;
  }

  vertices.splice(
    result.index,
    0,
    {
      x: world.x,
      y: world.y
    }
  );

  wallDrawMode = false;

  canvas.style.cursor = "default";

  drawRoom();
});

/* ================= FURNITURE ================= */

const furnitureLayer = document.getElementById("furniture-layer");
const resizePanel = document.getElementById("resize-panel");

const rw = document.getElementById("rw");
const rh = document.getElementById("rh");

let furniture = {};
let nextId = 1;

let draggingFurniture = null;
let offset = {};
let selected = null;
let moveMode = false;

function pointInPolygon(p, poly) {

  let inside = false;

  for (let i=0,j=poly.length-1;i<poly.length;j=i++) {

    const xi=poly[i].x, yi=poly[i].y;
    const xj=poly[j].x, yj=poly[j].y;

    const intersect =
      ((yi>p.y)!=(yj>p.y)) &&
      (p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

function rectInsidePolygon(x, y, w, h, poly) {

  const corners = [
    { x:x, y:y },
    { x:x+w, y:y },
    { x:x+w, y:y+h },
    { x:x, y:y+h }
  ];

  return corners.every(pt => pointInPolygon(pt, poly));
}

function overlap(id,x,y,w,h){

  for(const k in furniture){

    if(k===id) continue;

    const o=furniture[k];

    const ox=parseFloat(o.el.style.left);
    const oy=parseFloat(o.el.style.top);

    const ow = ftToPx(o.wFt);
    const oh = ftToPx(o.hFt);

    if (
      x < ox + ow &&
      x + w > ox &&
      y < oy + oh &&
      y + h > oy
    ) {
      return true;
    }
  }

  return false;
}

function createFurniture(name,img,wFt,hFt,x,y){

  const id = "f" + nextId++;

  const el = document.createElement("div");

  el.className = "furniture";

  const wPx = ftToPx(wFt);
  const hPx = ftToPx(hFt);

  el.style.width = wPx + "px";
  el.style.height = hPx + "px";

  el.style.left = x - wPx/2 + "px";
  el.style.top = y - hPx/2 + "px";

  furniture[id] = { el, wFt, hFt };

  el.innerHTML = `
    <img src="${img}">
  `;

  const ctr = document.createElement("div");
  ctr.className = "f-controls";

  const del = document.createElement("button");
  del.textContent = "✕";

  ctr.appendChild(del);

  el.appendChild(ctr);

  del.onclick = e => {

    e.stopPropagation();

    el.remove();

    delete furniture[id];

    resizePanel.style.display = "none";
  };

  el.onmousedown = e => {

    if(!moveMode) return;

    e.stopPropagation();

    draggingFurniture = id;
    selected = id;
    document.querySelectorAll(".furniture")
      .forEach(f => f.classList.remove("selected"));

    el.classList.add("selected");

    rw.value = furniture[id].wFt;
    rh.value = furniture[id].hFt;

    resizePanel.style.display = "block";

    const world =
        screenToWorld(e.clientX, e.clientY);

    const left =
        parseFloat(el.style.left);

    const top =
        parseFloat(el.style.top);

    offset.x = world.x - left;
    offset.y = world.y - top;
  };

  furnitureLayer.appendChild(el);

  furniture[id] = { el, wFt, hFt };
}

document.addEventListener("mousemove", e => {

  if(!draggingFurniture) return;

  const it = furniture[draggingFurniture];

    const world =
        screenToWorld(e.clientX, e.clientY);

    const nx = world.x - offset.x;
    const ny = world.y - offset.y;

  const wPx = ftToPx(it.wFt);
  const hPx = ftToPx(it.hFt);

  if(
    rectInsidePolygon(nx,ny,wPx,hPx,vertices) &&
    !overlap(draggingFurniture,nx,ny,wPx,hPx)
  ){
    it.el.style.left = nx + "px";
    it.el.style.top = ny + "px";
  }
});

document.addEventListener("mouseup", () => {
  draggingFurniture = null;
});

rw.onchange = rh.onchange = () => {

  if(!selected) return;

  const it = furniture[selected];

  const wFt = Math.round(Number(rw.value));
  const hFt = Math.round(Number(rh.value));

  const x = parseFloat(it.el.style.left);
  const y = parseFloat(it.el.style.top);

  const wPx = ftToPx(wFt);
  const hPx = ftToPx(hFt);

  if(
    rectInsidePolygon(x,y,wPx,hPx,vertices) &&
    !overlap(selected,x,y,wPx,hPx)
  ){

    it.wFt = wFt;
    it.hFt = hFt;

    it.el.style.width = wPx + "px";
    it.el.style.height = hPx + "px";

  } else {

    rw.value = it.wFt;
    rh.value = it.hFt;
  }
};

document.querySelectorAll(".f-item").forEach(i => {

  i.ondragstart = () => {

    window.dragData = {
      n: i.dataset.name,
      img: i.dataset.img,
      w: +i.dataset.w,
      h: +i.dataset.h
    };
  };
});

canvas.ondragover = e => e.preventDefault();

canvas.ondrop = e => {

  const world =
    screenToWorld(e.clientX, e.clientY);

  createFurniture(
    dragData.n,
    dragData.img,
    dragData.w,
    dragData.h,
    world.x,
    world.y
  );
};

window.addEventListener("load", () => {

  initRoom();

  const viewportRect =
    viewport.getBoundingClientRect();

  const canvasRect =
    canvas.getBoundingClientRect();

  /* CENTER CANVAS INSIDE VIEWPORT */
  panX =
    viewportRect.width / 2
    - 2400;

  panY =
    viewportRect.height / 2
    - 2250;

  updateWorkspaceTransform();
});

window.addEventListener("resize", initRoom);

const sizeInfo = document.getElementById("size-info");

const moveBtn = document.getElementById("move-furniture-btn");
const doneBtn = document.getElementById("done-move-btn");

moveBtn.onclick = () => {
  moveMode = true;
  moveBtn.style.display = "none";
  doneBtn.style.display = "block";

  document.querySelectorAll(".furniture")
    .forEach(f => f.style.cursor = "move");
  };

  doneBtn.onclick = () => {
    moveMode = false;
    moveBtn.style.display = "block";
    doneBtn.style.display = "none";

    draggingFurniture = null;

    document.querySelectorAll(".furniture").forEach(f => {
      f.classList.remove("selected");
      f.style.cursor = "default";
    });

    resizePanel.style.display = "none";
  };

/* ================= SIDEBAR PANELS ================= */

const sidebarItems =
  document.querySelectorAll(".sidebar-item");

const toolPanel =
  document.getElementById("tool-panel");

const furnishPanel =
  document.getElementById("furnish-panel");

const editPanel =
  document.getElementById("edit-panel");

/* DEFAULT */
furnishPanel.classList.add("active");

document.getElementById("furnish-tab")
.onclick = () => {

  sidebarItems.forEach(i =>
    i.classList.remove("active"));

  document.getElementById("furnish-tab")
    .classList.add("active");

  furnishPanel.classList.add("active");

  editPanel.classList.remove("active");

  toolPanel.style.transform = "translateX(0)";
};

document.getElementById("edit-tab")
.onclick = () => {

  sidebarItems.forEach(i =>
    i.classList.remove("active"));

  document.getElementById("edit-tab")
    .classList.add("active");

  editPanel.classList.add("active");

  furnishPanel.classList.remove("active");

  toolPanel.style.transform = "translateX(0)";
};

function updateSizeInfo(w,h){

  const wf = (w / PIXELS_PER_FOOT).toFixed(2);
  const hf = (h / PIXELS_PER_FOOT).toFixed(2);

  sizeInfo.textContent = `${wf} ft × ${hf} ft`;
}

</script>

</body>
</html>
